name: NTC Compiler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NTC Compiler
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Compile NTC compiler
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            compiler/ntc.c -o build/ntc

      - name: Compile arithmetic example
        run: |
          ./build/ntc examples/hello.ntc build/hello.exe

      - name: Verify DOS MZ header and file size
        run: |
          python3 - <<'PY'
          import os
          import struct

          path = "build/hello.exe"
          with open(path, "rb") as f:
              data = f.read()

          assert data[:2] == b"MZ", "Missing MZ signature"
          assert len(data) >= 32, "Truncated MZ header"

          last_page, pages = struct.unpack_from("<HH", data, 2)
          header_paragraphs = struct.unpack_from("<H", data, 8)[0]
          ip = struct.unpack_from("<H", data, 20)[0]
          cs = struct.unpack_from("<H", data, 22)[0]

          declared_size = (
              (pages - 1) * 512 + last_page
              if last_page else pages * 512
          )

          assert declared_size == len(data), "MZ file size mismatch"
          assert header_paragraphs * 16 == 32, "Unexpected header size"
          assert cs == 0 and ip == 0, "Unexpected entry point"

          print(f"MZ header verified: {len(data)} bytes")
          PY

      - name: Generate SHA-256 checksums
        run: |
          sha256sum build/ntc build/hello.exe > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Verify generated checksums
        run: |
          sha256sum --check build/SHA256SUMS

      - name: Upload compiler, executable, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ntc-build-004
          path: |
            build/ntc
            build/hello.exe
            build/SHA256SUMS
          if-no-files-found: error
