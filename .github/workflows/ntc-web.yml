
name: NTC Web Compiler

on:
  push:
    branches:
      - main
    paths:
      - "compiler/**"
      - "web/**"
      - "docs/**"
      - ".github/workflows/ntc-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ntc-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Prepare website directories
        run: |
          mkdir -p web/compiler
          mkdir -p web/docs
          cp docs/*.md web/docs/

      - name: Compile NTC to WebAssembly
        run: |
          emcc compiler/ntc.c \
            -std=c11 \
            -O2 \
            -Wall \
            -Wextra \
            -Werror \
            -o web/compiler/ntc.js \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createNTCModule \
            -sENVIRONMENT=web \
            -sFORCE_FILESYSTEM=1 \
            -sEXPORTED_RUNTIME_METHODS=FS,callMain \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXIT_RUNTIME=1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
